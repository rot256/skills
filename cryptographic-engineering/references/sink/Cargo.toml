[package]
name = "sink"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
zeroize = { version = "1", features = ["derive"] }
digest = "0.11"
subtle = "2"
rand_core = "0.10"
sha3 = "0.11"
hmac = "0.13"
hkdf = "0.13"
ed25519-dalek = "3"
chacha20poly1305 = "0.11"
ml-kem = { version = "0.3", features = ["zeroize"] }

[dev-dependencies]
rand = "0.10"
